packages:
  - apps/*
  - packages/*
  - tools/*

nodeLinker: hoisted

catalogMode: prefer

catalog:
  '@fontsource-variable/nunito-sans': ^5.3.0
  '@lucide/svelte': ^1.61.0
  '@oxlint/plugins': 1.88.0
  "@types/node": ^26
  cn: ^0.5.0
  shadcn-svelte: ^1.7.1
  tailwind-variants: ^3.3.1
  tw-animate-css: ^1.4.0
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  electron-winstaller: true
  esbuild: true
